
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap');

  *{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .pv-root {
    font-family: 'Caveat', cursive;
    background: transparent;
    min-height: 520px;
    overflow: hidden;
    border: 0.5px solid var(--color-border-tertiary);
  }

  .pv-navbar {
    position: relative;
    width: 100%;
    padding: 18px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-sizing: border-box;
    background: linear-gradient(180deg, rgba(100,0,10,0.92) 0%, rgba(100,0,10,0.82) 60%, rgba(100,0,10,0) 100%);
    z-index: 10;
  }

  .pv-logo {
    font-family: 'Caveat', cursive;
    font-size: 32px;
    font-weight: 700;
    color: #c69f02;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .pv-nav-buttons {
    display: flex;
    gap: 16px;
  }

  .pv-btn {
    outline: none;
    cursor: pointer;
    border: 1px solid #c69f02;
    padding: 0.55rem 1.5rem;
    margin: 0;
    font-family: 'Caveat', cursive;
    font-size: 16px;
    font-weight: 700;
    letter-spacing: 0.05rem;
    border-radius: 500px;
    overflow: hidden;
    background: transparent;
    color: #c69f02;
    position: relative;
    display: inline-block;
    transition: color 0.4s;
  }

  .pv-btn span {
    position: relative;
    z-index: 10;
    transition: color 0.4s;
  }

  .pv-btn:hover span {
    color: #000;
  }

  .pv-btn::before {
    content: "";
    position: absolute;
    top: 0;
    left: -10%;
    width: 120%;
    height: 100%;
    z-index: 0;
    background: #c69f02;
    transform: skew(30deg) translateX(-110%);
    transition: transform 0.4s cubic-bezier(0.3, 1, 0.8, 1);
  }

  .pv-btn:hover::before {
    transform: skew(30deg) translateX(0%);
  }

  .pv-hero {
    position: relative;
    width: 100%;
    height: 220px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    margin-top: -60px;
  }

  .pv-hero-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #2a0a0a 0%, #6b1a1a 40%, #c8a060 100%);
    opacity: 0.18;
  }

  .pv-hero-placeholder {
    width: 90%;
    height: 170px;
    border: 2px dashed #c69f02;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(198,159,2,0.04);
    position: relative;
    z-index: 2;
    margin-top: 30px;
  }

  .pv-hero-placeholder i {
    font-size: 36px;
    color: #c69f02;
    opacity: 0.7;
  }

  .pv-hero-label {
    font-family: 'Caveat', cursive;
    font-size: 16px;
    color: #c69f02;
    opacity: 0.7;
    letter-spacing: 1px;
  }

  .pv-content {
    padding: 12px 32px 32px;
    background: #fff;
  }

  .pv-section-label {
    font-family: sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--color-text-tertiary);
    margin-bottom: 10px;
  }

  .pv-content-placeholder {
    width: 100%;
    height: 120px;
    border: 2px dashed var(--color-border-secondary);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--color-background-secondary);
  }

  .pv-content-placeholder i {
    font-size: 28px;
    color: var(--color-text-tertiary);
  }

  .pv-content-label {
    font-family: sans-serif;
    font-size: 13px;
    color: var(--color-text-tertiary);
  }

  .pv-anno {
    display: flex;
    gap: 8px;
    align-items: flex-start;
    margin-top: 8px;
  }
  .pv-anno-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c69f02;
    margin-top: 5px;
    flex-shrink: 0;
  }
  .pv-anno-text {
    font-family: sans-serif;
    font-size: 12px;
    color: var(--color-text-secondary);
  }
</style>

<div class="pv-root">

  <div class="pv-navbar">
    <div class="pv-logo">PARNAVAZ</div>
    <div class="pv-nav-buttons">
      <button class="pv-btn"><span>KARGA</span></button>
      <button class="pv-btn"><span>HAKKIMIZDA</span></button>
    </div>
  </div>

  <div class="pv-hero">
    <div class="pv-hero-bg"></div>
    <div class="pv-hero-placeholder">
      <i class="ti ti-photo" aria-hidden="true"></i>
      <span class="pv-hero-label">Arka plan fotoğrafı — şeffaf geçişli overlay</span>
    </div>
  </div>
</div>
